<svg id="architecture-svg" viewBox="0 0 1120 590" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-title svg-desc" width="1120" height="590"><title id="svg-title">Arquitetura do processador de apostas</title><desc id="svg-desc">HTTP e consumidor SQS compartilham Wagering. WagerStore aplica o domínio e grava PostgreSQL atomicamente. Publisher lê a outbox após commit e envia eventos. Worker retoma referências; falhas seguem para retry e DLQ.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8198ac"/></marker></defs><style>.node{cursor:pointer}.node rect{fill:#112231;stroke:#304759;stroke-width:1.5}.node text{fill:#edf3f8;font-family:system-ui,sans-serif;font-size:16px;font-weight:600}.node .sub{fill:#b1c1d0;font-size:12px;font-weight:400}.node:hover rect,.node.selected rect{stroke:#7ee0b6;stroke-width:2.5}.node:focus-visible{outline:3px solid #8dd8ec;outline-offset:4px}.edge{fill:none;stroke:#8198ac;stroke-width:1.5;marker-end:url(#arrow)}.edge-label{fill:#b1c1d0;font:12px system-ui,sans-serif}</style><rect width="1120" height="590" fill="#09111b"/><rect x="550" y="207" width="260" height="339" rx="15" fill="#101b2a" stroke="#59497e" stroke-dasharray="5 5"/><text x="568" y="229" fill="#c0a5ff" font-family="system-ui,sans-serif" font-size="12">UMA TRANSAÇÃO SQL</text>
<path class="edge" d="M250 115H300"/><path class="edge" d="M520 115H680V245"/><text class="edge-label" x="557" y="103">submit</text><path class="edge" d="M250 290H300"/><path class="edge" d="M410 245V160"/><text class="edge-label" x="425" y="198">mesmo caso de uso</text><path class="edge" d="M790 290H840"/><text class="edge-label" x="805" y="275">regra</text><path class="edge" d="M680 335V435"/><text class="edge-label" x="695" y="385">commit atômico</text><path class="edge" d="M790 485H840"/><text class="edge-label" x="800" y="467">outbox</text><path class="edge" d="M1060 485H1093V115H1060"/><text class="edge-label" x="1081" y="340" transform="rotate(-90 1081 340)">envio após commit</text><path class="edge" d="M410 335V380H140V435"/><text class="edge-label" x="180" y="370">inválida / tentativas esgotadas</text><path class="edge" d="M520 485H535V315H570"/><text class="edge-label" x="325" y="420">agenda persistida</text><g id="nodes"><g class="node" data-node="http" aria-label="API HTTP · NestJS: ver responsabilidade e código"><rect x="30" y="70" width="220" height="90" rx="10"/><path d="M47 92v48" stroke="#7ee0b6" stroke-width="4" stroke-linecap="round"/><text x="62" y="105">API HTTP · NestJS</text><text class="sub" x="62" y="129">POST /wagering/transactions</text><text class="sub" x="62" y="147">Idempotency-Key</text></g><g class="node" data-node="usecase" aria-label="Caso de uso · Wagering: ver responsabilidade e código"><rect x="300" y="70" width="220" height="90" rx="10"/><path d="M317 92v48" stroke="#7ee0b6" stroke-width="4" stroke-linecap="round"/><text x="332" y="105">Caso de uso · Wagering</text><text class="sub" x="332" y="129">Valida contrato e calcula hash</text><text class="sub" x="332" y="147">Compartilhado por HTTP e SQS</text></g><g class="node" data-node="events" aria-label="SQS · eventos: ver responsabilidade e código"><rect x="840" y="70" width="220" height="90" rx="10"/><path d="M857 92v48" stroke="#f5ca81" stroke-width="4" stroke-linecap="round"/><text x="872" y="105">SQS · eventos</text><text class="sub" x="872" y="129">wager-events.fifo</text><text class="sub" x="872" y="147">Assinante deduplica eventId</text></g><g class="node" data-node="requests" aria-label="SQS · solicitações: ver responsabilidade e código"><rect x="30" y="245" width="220" height="90" rx="10"/><path d="M47 267v48" stroke="#f5ca81" stroke-width="4" stroke-linecap="round"/><text x="62" y="280">SQS · solicitações</text><text class="sub" x="62" y="304">wager-transactions.fifo</text><text class="sub" x="62" y="322">WagerTransactionRequested</text></g><g class="node" data-node="consumer" aria-label="WagerConsumer: ver responsabilidade e código"><rect x="300" y="245" width="220" height="90" rx="10"/><path d="M317 267v48" stroke="#7ee0b6" stroke-width="4" stroke-linecap="round"/><text x="332" y="280">WagerConsumer</text><text class="sub" x="332" y="304">Envelope, heartbeat e retry</text><text class="sub" x="332" y="322">Ack somente após commit</text></g><g class="node" data-node="store" aria-label="WagerStore: ver responsabilidade e código"><rect x="570" y="245" width="220" height="90" rx="10"/><path d="M587 267v48" stroke="#7ee0b6" stroke-width="4" stroke-linecap="round"/><text x="602" y="280">WagerStore</text><text class="sub" x="602" y="304">Lock por wallet e idempotência</text><text class="sub" x="602" y="322">Executa domínio e persiste</text></g><g class="node" data-node="domain" aria-label="Domínio financeiro: ver responsabilidade e código"><rect x="840" y="245" width="220" height="90" rx="10"/><path d="M857 267v48" stroke="#7ee0b6" stroke-width="4" stroke-linecap="round"/><text x="872" y="280">Domínio financeiro</text><text class="sub" x="872" y="304">Money · Wallet · applyWager</text><text class="sub" x="872" y="322">Decide efeitos; não grava SQL</text></g><g class="node" data-node="dlq" aria-label="SQS · DLQ: ver responsabilidade e código"><rect x="30" y="435" width="220" height="100" rx="10"/><path d="M47 457v48" stroke="#f5ca81" stroke-width="4" stroke-linecap="round"/><text x="62" y="470">SQS · DLQ</text><text class="sub" x="62" y="494">wager-transactions-dlq.fifo</text><text class="sub" x="62" y="512">Envelope preservado para análise</text></g><g class="node" data-node="references" aria-label="Worker · referências: ver responsabilidade e código"><rect x="300" y="435" width="220" height="100" rx="10"/><path d="M317 457v48" stroke="#7ee0b6" stroke-width="4" stroke-linecap="round"/><text x="332" y="470">Worker · referências</text><text class="sub" x="332" y="494">Retoma PENDING_REFERENCE</text><text class="sub" x="332" y="512">Dez tentativas ou TTL de 24h</text></g><g class="node" data-node="database" aria-label="PostgreSQL · MikroORM: ver responsabilidade e código"><rect x="570" y="435" width="220" height="100" rx="10"/><path d="M587 457v48" stroke="#c0a5ff" stroke-width="4" stroke-linecap="round"/><text x="602" y="470">PostgreSQL · MikroORM</text><text class="sub" x="602" y="494">Saldo + transação + ledger</text><text class="sub" x="602" y="512">Inbox (SQS) + outbox</text></g><g class="node" data-node="publisher" aria-label="OutboxPublisher: ver responsabilidade e código"><rect x="840" y="435" width="220" height="100" rx="10"/><path d="M857 457v48" stroke="#7ee0b6" stroke-width="4" stroke-linecap="round"/><text x="872" y="470">OutboxPublisher</text><text class="sub" x="872" y="494">FOR UPDATE SKIP LOCKED</text><text class="sub" x="872" y="512">Marca publicação após envio</text></g></g><text class="edge-label" x="30" y="575">Docker Compose · SQS emulado por LocalStack · workers na API e processos opcionais</text></svg>