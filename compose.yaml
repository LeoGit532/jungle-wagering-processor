services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: challenge
      POSTGRES_PASSWORD: challenge
      POSTGRES_DB: wagering
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U challenge -d wagering']
      interval: 5s
      timeout: 3s
      retries: 10
  localstack:
    image: localstack/localstack:4.0
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - '${SQS_PORT:-4566}:4566'
  migrate:
    pull_policy: never
    image: jungle-wagering:local
    command: ['bun', 'run', 'db:up']
    environment:
      DATABASE_URL: postgresql://challenge:challenge@postgres:5432/wagering
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build: .
    image: jungle-wagering:local
    ports:
      - '${API_PORT:-3100}:3000'
    environment:
      DATABASE_URL: postgresql://challenge:challenge@postgres:5432/wagering
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'bun', '-e', "const r=await fetch('http://localhost:3000/health/ready');process.exit(r.ok?0:1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    stop_grace_period: 45s
  worker:
    pull_policy: never
    image: jungle-wagering:local
    profiles: ['scaled']
    command: ['bun', 'src/worker.ts']
    environment:
      DATABASE_URL: postgresql://challenge:challenge@postgres:5432/wagering
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
    stop_grace_period: 45s
  tests:
    image: jungle-wagering:local
    pull_policy: never
    profiles: ['test']
    command: ['bun', 'test', 'tests/unit', 'tests/integration']
    environment:
      TEST_DATABASE_URL: postgresql://challenge:challenge@postgres:5432/postgres
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SILENT_LOGS: '1'
    volumes:
      - ./tests:/app/tests:ro
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
  tools:
    image: jungle-wagering:local
    pull_policy: never
    profiles: ['tools']
    command: ['bun', 'run', 'demo']
    environment:
      API_BASE_URL: http://api:3000
      TEST_DATABASE_URL: postgresql://challenge:challenge@postgres:5432/postgres
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      PROCESSING_INSTANCES: '1'
      SILENT_LOGS: '1'
    volumes:
      - ./docs/reports:/app/docs/reports
      - ./tests:/app/tests:ro
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres-data:
